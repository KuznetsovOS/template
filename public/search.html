<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="favicon.ico" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Web site created using create-react-app" />
    <title>Last.fm</title>
  </head>
  <body>
    <header class="header">
        <div class="container">
              <div class="logo">
                  <a href="index.html">
                      <img src="ico.png" alt="Last.fm Logo">
                  </a>
              </div>
  
              <div class="search-container">
                  <input type="text" class="search-input" placeholder="Search songs, artists...">
                  <button class="search-button">
                  </button>
              </div>
  
              <nav class="main-nav">
                  <ul>
                      <li><a href="#">Live</a></li>
                      <li><a href="#">Music</a></li>
                      <li><a href="#">Charts</a></li>
                      <li><a href="#">Events</a></li>
                  </ul>
              </nav>
        </div>
    </header>

    <main class="main-content">
        <div class="search-results">
            <div class="search-header">
                <h1 class="search-query">Results for ""</h1>
            </div>
            
            <div class="results-tabs">
                <div class="tab active" data-tab="top-tab">Top</div>
                <div class="tab" data-tab="artists-tab">Artists</div>
                <div class="tab" data-tab="tracks-tab">Tracks</div>
                <div class="tab" data-tab="albums-tab">Albums</div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-links">
                <div class="footer-column">
                    <h4>Company</h4>
                    <ul>
                        <li><a href="#">About Last.fm</a></li>
                        <li><a href="#">Contact us</a></li>
                        <li><a href="#">Jobs</a></li>
                    </ul>
                </div>
                <div class="footer-column">
                    <h4>Help</h4>
                    <ul>
                        <li><a href="#">Track my music</a></li>
                        <li><a href="#">Community support</a></li>
                        <li><a href="#">Community guidelines</a></li>
                    </ul>
                </div>
            </div>
            <div class="footer-bottom">
                <p>Last.fm</p>
            </div>
        </div>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
